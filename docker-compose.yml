name: go-market

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      FRONTEND_HTTP_PORT: "${FRONTEND_HTTP_PORT}"
      GATEWAY_HTTP_PORT: "${GATEWAY_HTTP_PORT}"
    ports:
      - "${FRONTEND_HTTP_PORT}:${FRONTEND_HTTP_PORT}"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://localhost:${FRONTEND_HTTP_PORT}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - go-market-network

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      GATEWAY_HTTP_ADDRESS: ":${GATEWAY_HTTP_PORT}"
      CATALOG_GRPC_ADDRESS: "catalog:${CATALOG_GRPC_PORT}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
    ports:
      - "${GATEWAY_HTTP_PORT}:${GATEWAY_HTTP_PORT}"
    depends_on:
      catalog:
        condition: service_healthy
    networks:
      - go-market-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=-",
          "http://127.0.0.1:${GATEWAY_HTTP_PORT}/readyz",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      CATALOG_GRPC_ADDRESS: ":${CATALOG_GRPC_PORT}"
    ports:
      - "${CATALOG_GRPC_PORT}:${CATALOG_GRPC_PORT}"
    networks:
      - go-market-network
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/grpc_health_probe",
          "-addr=127.0.0.1:${CATALOG_GRPC_PORT}",
          "-service=catalog.v1.CatalogService",
          "-connect-timeout=1s",
          "-rpc-timeout=1s",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  go-market-network:
    driver: bridge
