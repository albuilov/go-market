syntax = "proto3";

package catalog.v1;

import "auth/v1/auth.proto";
import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "go-market/gen/go/catalog/v1;catalogv1";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Go Market API"
    version: "1.0.0"
    description: "Public HTTP API of the Go Market application."
  }
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT access token with the Bearer prefix."
      }
    }
  }
  tags: {
    name: "CatalogService"
    description: "Product catalog operations."
  }
};

service CatalogService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse) {
    option (google.api.http) = {get: "/api/v1/products"};

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List products"
      responses: {
        key: "default"
        value: {
          description: "An error response."
          schema: {
            json_schema: {ref: ".common.v1.ErrorResponse"}
          }
        }
      }
    };

    option (auth.v1.authorization) = {public: true};
  }
}

message ListProductsRequest {
  optional int32 size = 1 [
    (buf.validate.field).int32 = {
      gte: 1
      lte: 100
    }
  ];
}

message ListProductsResponse {
  repeated Product products = 1;
}

message Product {
  string id = 1;
  string name = 2;
  int64 price_minor_units = 3;
  string currency_code = 4;
}
